<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12263a">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Restaurant Menu</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <!-- HOME -->
    <main class="home" id="home">
      <header class="topbar">
        <div class="logo" id="logo">
          <!-- Replace logo.png with your own file -->
          <img src="logo.png" alt="Logo" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-name',textContent:'Your Logo'}))">
        </div>

        <div class="lang" role="group" aria-label="Language">
          <button class="lang-btn" data-lang="tr" type="button">TR</button>
          <button class="lang-btn" data-lang="en" type="button">EN</button>
          <span class="lang-thumb" aria-hidden="true"></span>
        </div>
      </header>

      <section class="cards">
        <button class="card card--promo" data-section="promo" type="button">
          <svg class="card-icon" viewBox="0 0 120 120" aria-hidden="true">
            <path d="M18 60 60 18h40v40L58 100a6 6 0 0 1-8.5 0L18 68a6 6 0 0 1 0-8Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
            <circle cx="82" cy="38" r="8" fill="currentColor"/>
            <path d="M46 74l24-24" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          </svg>
          <span class="card-text">
            <span class="card-title" data-i18n="promo.title"></span>
            <span class="card-sub" data-i18n="cta"></span>
          </span>
        </button>

        <button class="card card--food" data-section="food" type="button">
          <svg class="card-icon" viewBox="0 0 120 120" aria-hidden="true">
            <path d="M12 74h96a48 48 0 0 1-96 0Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
            <path d="M40 58c-6-8 6-12 0-22M60 58c-6-8 6-12 0-22M80 58c-6-8 6-12 0-22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
            <path d="M44 104h32" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          </svg>
          <span class="card-text">
            <span class="card-title" data-i18n="food.title"></span>
            <span class="card-sub" data-i18n="cta"></span>
          </span>
        </button>

        <button class="card card--drink" data-section="drink" type="button">
          <svg class="card-icon" viewBox="0 0 120 120" aria-hidden="true">
            <path d="M34 20h52l-6 80a8 8 0 0 1-8 7H48a8 8 0 0 1-8-7Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
            <path d="M37 50h46" stroke="currentColor" stroke-width="6"/>
            <path d="M68 20l14-14" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          </svg>
          <span class="card-text">
            <span class="card-title" data-i18n="drink.title"></span>
            <span class="card-sub" data-i18n="cta"></span>
          </span>
        </button>
      </section>
    </main>

    <!-- FULL-SCREEN MENU VIEWER -->
    <section class="viewer" id="viewer" aria-hidden="true" hidden>
      <header class="viewer-bar">
        <button class="back" id="backBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="back"></span>
        </button>
        <h2 class="viewer-title" id="viewerTitle"></h2>
        <div class="lang lang--viewer" role="group" aria-label="Language">
          <button class="lang-btn" data-lang="tr" type="button">TR</button>
          <button class="lang-btn" data-lang="en" type="button">EN</button>
          <span class="lang-thumb" aria-hidden="true"></span>
        </div>
      </header>
      <div class="viewer-body" id="viewerBody"></div>
    </section>

  </div>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
